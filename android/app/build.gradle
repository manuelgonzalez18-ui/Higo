apply plugin: 'com.android.application'

android {
    namespace "com.higoapp.ve"
    compileSdk 35
    defaultConfig {
        applicationId "com.higoapp.ve"
        minSdkVersion 23
        targetSdkVersion 35
        // Higo 1.5.25: background passenger voice/status, reliable chat push and SOS GPS follow-up.
        versionCode 57
        versionName "1.5.25"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def envOrProp = { String name, String defaultValue = '' ->
        return System.getenv(name) ?: project.findProperty(name) ?: defaultValue
    }

    signingConfigs {
        release {
            storeFile file('release-key.jks')
            storePassword envOrProp('ANDROID_KEYSTORE_PASSWORD')
            keyAlias envOrProp('ANDROID_KEY_ALIAS', 'higo-key')
            keyPassword envOrProp('ANDROID_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // MyFirebaseMessagingService lives in the app module and imports the FCM
    // service/message classes directly. The Capacitor push plugin declares FCM
    // with `implementation`, so those classes are not exposed transitively to
    // this module's compile classpath; declare the same dependency explicitly.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation project(':capacitor-android')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
