name: Deploy current Higo Driver

# Despliegue de respaldo exclusivamente manual.
# El despliegue automático de higodriver.com ya forma parte de deploy.yml.
# Mantener ambos activos provocaba conexiones FTPS simultáneas y jobs colgados.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-current-higodriver
  cancel-in-progress: true

jobs:
  deploy-higodriver:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current Higo-Driver site
        uses: actions/checkout@v4
        with:
          repository: manuelgonzalez18-ui/Higo-Driver
          ref: main
          path: site

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy current site to higodriver.com
        env:
          HIGODRIVER_FTP_SERVER: ${{ secrets.HIGODRIVER_FTP_SERVER }}
          HIGODRIVER_FTP_USERNAME: ${{ secrets.HIGODRIVER_FTP_USERNAME }}
          HIGODRIVER_FTP_PASSWORD: ${{ secrets.HIGODRIVER_FTP_PASSWORD }}
        run: |
          if [ -z "$HIGODRIVER_FTP_PASSWORD" ]; then
            echo "::error::HIGODRIVER_FTP_PASSWORD no está configurado."
            exit 1
          fi

          attempt=1
          max=2
          while [ "$attempt" -le "$max" ]; do
            if timeout 240s lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-protect-list true;
            set ssl:verify-certificate no;
            set net:timeout 30;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set xfer:clobber on;
            set ftp:use-allo off;
            set mirror:parallel-transfer-count 1;
            open -u '$HIGODRIVER_FTP_USERNAME','$HIGODRIVER_FTP_PASSWORD' '$HIGODRIVER_FTP_SERVER';
            mirror --reverse --verbose --parallel=1 --no-perms --ignore-time --exclude '(^|/)\.git(/|$)' --exclude '(^|/)\.github(/|$)' ./site/ ./;
            put -O ./ ./site/index.html;
            "; then
              exit 0
            fi

            echo "::warning::Deploy de higodriver falló (intento $attempt/$max)."
            attempt=$((attempt + 1))
            sleep 10
          done

          echo "::error::Deploy de higodriver falló después de $max intentos."
          exit 1

      - name: Smoke test higodriver.com
        run: |
          sleep 8
          for i in 1 2 3; do
            cache_bust=$(date +%s)
            if curl -fsS --max-time 20 "https://higodriver.com/?cb=$cache_bust" -o /tmp/higodriver.html \
              && grep -q "Conduce con Higo" /tmp/higodriver.html; then
              echo "✓ higodriver.com sirve la versión actual."
              exit 0
            fi
            sleep 6
          done
          echo "::error::higodriver.com no superó la prueba de humo."
          exit 1
