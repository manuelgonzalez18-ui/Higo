name: Apply and build Higo 1.5.23 notifications

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_higo_notification_latency_1_5_23.py
      - .github/workflows/apply-higo-notification-latency-1.5.23.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build:
    name: Apply, validate and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply notification latency corrections
        run: |
          python scripts/apply_higo_notification_latency_1_5_23.py
          sed -i 's#urn:ietf:params:oauth2:grant-type:jwt-bearer#urn:ietf:params:oauth:grant-type:jwt-bearer#' public/api/send-ride-message-push.php
          grep -q 'Ahora estás disponible para recibir servicios' src/pages/DriverDashboard.jsx
          grep -q 'higo_rides_v13_immediate' src/pages/DriverDashboard.jsx
          grep -q 'higo_messages_v3_immediate' src/components/ChatWidget.jsx
          grep -q "'type' => 'ride_message'" public/api/send-ride-message-push.php
          grep -q 'versionCode 55' android/app/build.gradle
          grep -q 'versionName "1.5.23"' android/app/build.gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run driver, chat, voice and route regressions
        run: |
          node --test \
            tests/notificationLatencyRegression.test.mjs \
            tests/nativeDriverChatGhostRegression.test.mjs \
            tests/driverGhostOfferRegression.test.mjs \
            tests/passengerRideVoice.test.mjs \
            tests/routeWaypoints.test.mjs

      - name: Validate PHP notification endpoints
        run: |
          php -l public/api/send-ride-offer-push.php
          php -l public/api/send-ride-request-push.php
          php -l public/api/send-ride-message-push.php

      - name: Build production web bundle
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 no está configurado"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release-key.jks
          magic=$(head -c 2 android/app/release-key.jks | xxd -p)
          if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
            echo "::error::Keystore inválido (magic=0x$magic)"
            exit 1
          fi

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Commit validated corrections to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/services/notificationService.js \
            src/pages/DriverDashboard.jsx \
            src/components/ChatWidget.jsx \
            public/api/send-ride-offer-push.php \
            public/api/send-ride-request-push.php \
            public/api/send-ride-message-push.php \
            android/app/src/main/java/com/higoapp/ve/MyFirebaseMessagingService.java \
            android/app/build.gradle \
            tests/*.mjs
          git diff --cached --check
          git commit -m 'fix(notifications): deliver driver and chat alerts immediately'
          git push origin HEAD:main

      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab higo-1.5.23-55-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk higo-1.5.23-55-release.apk
          sha256sum higo-1.5.23-55-release.aab higo-1.5.23-55-release.apk > SHA256SUMS.txt
          ls -lh higo-1.5.23-55-release.aab higo-1.5.23-55-release.apk SHA256SUMS.txt

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.23-55-aab
          path: |
            higo-1.5.23-55-release.aab
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.23-55-apk
          path: |
            higo-1.5.23-55-release.apk
            SHA256SUMS.txt
          retention-days: 30
