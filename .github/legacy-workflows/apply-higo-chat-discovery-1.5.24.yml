name: Apply and build Higo 1.5.24 chat discovery

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_higo_chat_discovery_1_5_24.py
      - .github/workflows/apply-higo-chat-discovery-1.5.24.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-build:
    name: Apply, validate and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply active ride chat discovery correction
        run: |
          # The canonical release workflow is already maintained directly in
          # main. Trim that obsolete migration block from the one-shot patcher
          # before executing it, so the bot commit contains source changes only.
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_higo_chat_discovery_1_5_24.py')
          source = path.read_text(encoding='utf-8')
          marker = '# Update the canonical Android build workflow so the post-fix commit does not'
          if marker not in source:
              raise SystemExit('canonical workflow block marker not found')
          source = source.split(marker, 1)[0]
          source += "print('Applied Higo 1.5.24 active-ride chat discovery fix.')\n"
          path.write_text(source, encoding='utf-8')
          PY
          python scripts/apply_higo_chat_discovery_1_5_24.py
          sed -i 's/Higo 1.5.22: release with Higo Envíos voice milestones./Higo 1.5.24: chat discovers the active ride before the panel opens./' android/app/build.gradle
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/chatDiscoveryRegression.test.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    const realtime = chat.indexOf(\".channel(`ride-chat:${rideId}`)\", rideEffect);
              const openGuard = chat.indexOf('if (chatIsOpen) return;', rideEffect);
              assert.ok(rideEffect >= 0 && realtime > rideEffect);
              assert.ok(openGuard > realtime);"""
          new = """    const realtime = chat.indexOf(\".channel(`ride-chat:${rideId}`)\", rideEffect);
              const effectEnd = chat.indexOf('}, [rideId]);', realtime);
              assert.ok(rideEffect >= 0 && realtime > rideEffect);
              assert.ok(effectEnd > realtime);"""
          if old not in source:
              raise SystemExit('chat discovery regression block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          git checkout -- scripts/apply_higo_chat_discovery_1_5_24.py
          grep -q 'const setupRideDiscovery' src/components/ChatWidget.jsx
          grep -q 'filter: `user_id=eq.${currentUserId}`' src/components/ChatWidget.jsx
          grep -q 'filter: `driver_id=eq.${currentUserId}`' src/components/ChatWidget.jsx
          grep -q 'versionCode 56' android/app/build.gradle
          grep -q 'versionName "1.5.24"' android/app/build.gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run chat, driver, voice and route regressions
        run: |
          node --test \
            tests/chatDiscoveryRegression.test.mjs \
            tests/notificationLatencyRegression.test.mjs \
            tests/nativeDriverChatGhostRegression.test.mjs \
            tests/driverGhostOfferRegression.test.mjs \
            tests/passengerRideVoice.test.mjs \
            tests/routeWaypoints.test.mjs

      - name: Build production web bundle
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 no está configurado"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release-key.jks
          magic=$(head -c 2 android/app/release-key.jks | xxd -p)
          if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
            echo "::error::Keystore inválido (magic=0x$magic)"
            exit 1
          fi

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Commit validated correction to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/ChatWidget.jsx \
            android/app/build.gradle \
            tests/chatDiscoveryRegression.test.mjs \
            tests/notificationLatencyRegression.test.mjs
          git diff --cached --check
          git commit -m 'fix(chat): subscribe before the panel opens'
          git push origin HEAD:main

      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab higo-1.5.24-56-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk higo-1.5.24-56-release.apk
          sha256sum higo-1.5.24-56-release.aab higo-1.5.24-56-release.apk > SHA256SUMS.txt
          ls -lh higo-1.5.24-56-release.aab higo-1.5.24-56-release.apk SHA256SUMS.txt

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.24-56-aab
          path: |
            higo-1.5.24-56-release.aab
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.24-56-apk
          path: |
            higo-1.5.24-56-release.apk
            SHA256SUMS.txt
          retention-days: 30
