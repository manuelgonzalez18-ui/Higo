name: Rebuild Higo 1.5.26 Passenger Resume Push

on:
  push:
    branches:
      - release/higo-1.5.25-background-alerts
    paths:
      - .github/workflows/rebuild-higo-1.5.26-passenger-resume-push.yml
      - tests/passengerResumePushRegression.test.mjs
      - android/app/src/main/java/com/higoapp/ve/MainActivity.java

permissions:
  contents: read

jobs:
  build-release:
    name: Test and build signed Higo 1.5.26
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout validated release branch
        uses: actions/checkout@v4
        with:
          ref: release/higo-1.5.25-background-alerts
          fetch-depth: 1

      - name: Verify release fixes
        run: |
          grep -q 'versionCode 58' android/app/build.gradle
          grep -q 'versionName "1.5.26"' android/app/build.gradle
          grep -q 'public void onStart()' android/app/src/main/java/com/higoapp/ve/MainActivity.java
          grep -q 'public void onStop()' android/app/src/main/java/com/higoapp/ve/MainActivity.java
          grep -q "syncRideNow('native-resume')" src/pages/RideStatusPage.jsx
          grep -q 'keepalive: true' src/utils/sendRideStatusPush.js
          grep -q 'higo_ride_status_v2' android/app/src/main/java/com/higoapp/ve/MyFirebaseMessagingService.java
          grep -q 'PowerManager.PARTIAL_WAKE_LOCK' android/app/src/main/java/com/higoapp/ve/MyFirebaseMessagingService.java

      - name: Lint ride status endpoint
        run: php -l public/api/send-ride-status-push.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run passenger and notification regressions
        run: |
          node --test \
            tests/passengerResumePushRegression.test.mjs \
            tests/backgroundPassengerAlertsRegression.test.mjs \
            tests/passengerRideVoice.test.mjs \
            tests/nativeDriverChatGhostRegression.test.mjs \
            tests/chatDiscoveryRegression.test.mjs \
            tests/notificationLatencyRegression.test.mjs \
            tests/driverGhostOfferRegression.test.mjs \
            tests/routeWaypoints.test.mjs

      - name: Build web bundle with production ride flags
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: |
          npm run build
          test -f dist/api/send-ride-status-push.php

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 no está configurado"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release-key.jks
          magic=$(head -c 2 android/app/release-key.jks | xxd -p)
          if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
            echo "::error::Keystore inválido (magic=0x$magic)"
            exit 1
          fi

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab higo-1.5.26-58-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk higo-1.5.26-58-release.apk
          sha256sum higo-1.5.26-58-release.aab higo-1.5.26-58-release.apk > SHA256SUMS.txt
          ls -lh higo-1.5.26-58-release.aab higo-1.5.26-58-release.apk SHA256SUMS.txt

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.26-58-aab
          path: |
            higo-1.5.26-58-release.aab
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.26-58-apk
          path: |
            higo-1.5.26-58-release.apk
            SHA256SUMS.txt
          retention-days: 30
