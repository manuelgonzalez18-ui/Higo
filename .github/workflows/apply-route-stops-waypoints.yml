name: Apply route stops and waypoints

on:
  pull_request:
    paths:
      - .github/workflows/apply-route-stops-waypoints.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-route-stops-waypoints.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          fetch-depth: 0

      - name: Prepare source-only route integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_route_stops_waypoints.py')
          source = path.read_text(encoding='utf-8')

          delimiter = '    // Vehicle Rates: viven en DB",\n'
          if source.count(delimiter) != 2:
              raise SystemExit(f'route patch delimiter count={source.count(delimiter)}')
          source = source.replace(delimiter, '    // Vehicle Rates: viven en DB""",\n')

          duplicate_block = '''replace_once(
              "src/services/directionsService.js",
              "        return haversineFallback(origin, destination);\\n",
              "        return haversineFallback(origin, destination, stops);\\n",
          )
          '''
          if source.count(duplicate_block) != 2:
              raise SystemExit(f'fallback patch block count={source.count(duplicate_block)}')

          replacement_block = '''directions_path = Path("src/services/directionsService.js")
          directions_source = directions_path.read_text(encoding="utf-8")
          fallback_needle = "        return haversineFallback(origin, destination);\\n"
          if directions_source.count(fallback_needle) != 2:
              raise SystemExit(f"directions fallback count={directions_source.count(fallback_needle)}")
          directions_path.write_text(
              directions_source.replace(
                  fallback_needle,
                  "        return haversineFallback(origin, destination, stops);\\n",
              ),
              encoding="utf-8",
          )
          '''
          source = source.replace(duplicate_block, replacement_block, 1)
          source = source.replace(duplicate_block, '', 1)

          release_marker = '''
          # ---------------------------------------------------------------------------
          # Android release: this behavior lives in the installed web bundle, therefore a
          '''
          marker_index = source.find(release_marker)
          if marker_index < 0:
              raise SystemExit('Android release marker not found')

          # This run publishes only the already validated route implementation.
          # Android version/workflow changes are released separately through a normal PR,
          # because GITHUB_TOKEN cannot create or update another workflow file.
          path.write_text(source[:marker_index] + '\n', encoding='utf-8')
          PY
          python scripts/apply_route_stops_waypoints.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run route-stop regression
        run: node --test tests/rideRouteStops.test.mjs

      - name: Validate full application and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
        run: npm run check

      - name: Verify route contract
        run: |
          grep -q "waypoints: buildGoogleWaypoints(normalizedStops)" src/components/InteractiveMapGoogle.jsx
          grep -q "optimizeWaypoints: false" src/components/InteractiveMapGoogle.jsx
          grep -q "sumGoogleRouteLegs(route)" src/components/InteractiveMapGoogle.jsx
          grep -q "getRoute(origin, destination, 'driving-traffic', normalizedStops)" src/components/InteractiveMapMapbox.jsx
          grep -q "stops={stops}" src/pages/RequestRidePage.jsx
          grep -q "stops={stops}" src/pages/ConfirmTripPage.jsx
          git diff --quiet -- android/app/build.gradle
          git diff --quiet -- .github/workflows/build-higo-1.5.18-aab.yml

      - name: Commit validated source integration to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/InteractiveMapGoogle.jsx \
            src/components/InteractiveMapMapbox.jsx \
            src/services/directionsService.js \
            src/pages/RequestRidePage.jsx \
            src/pages/ConfirmTripPage.jsx
          git commit -m "fix(route): trazar y cotizar viajes pasando por las paradas"
          git push origin HEAD:main
