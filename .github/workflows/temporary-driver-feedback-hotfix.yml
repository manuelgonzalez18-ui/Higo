name: Temporary driver feedback hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-driver-feedback-hotfix.yml

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout hotfix branch
        run: |
          git fetch origin agent/fix-driver-feedback-20260725:agent/fix-driver-feedback-20260725
          git checkout agent/fix-driver-feedback-20260725

      - name: Apply reported fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              file_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/hooks/useDriverActiveTrip.js',
              """            let updated = activeRideRef.current;
            if (FEATURES.serverSideRideState) {
                updated = await markPickupArrival(activeRideRef.current.id);
                setActiveRide((current) => ({ ...current, ...updated }));
            }
            const arrivedAt = updated?.arrived_at_pickup_at
                ? new Date(updated.arrived_at_pickup_at).getTime()
                : Date.now();
""",
              """            let updated = activeRideRef.current;
            let arrivedAtIso = new Date().toISOString();
            if (FEATURES.serverSideRideState) {
                updated = await markPickupArrival(activeRideRef.current.id);
                arrivedAtIso = updated?.arrived_at_pickup_at || arrivedAtIso;
            } else {
                const { data, error } = await supabase
                    .from('rides')
                    .update({ arrived_at_pickup_at: arrivedAtIso })
                    .eq('id', activeRideRef.current.id)
                    .eq('status', 'accepted')
                    .select()
                    .single();
                if (error) throw error;
                updated = data;
            }
            setActiveRide((current) => ({ ...current, ...updated }));
            const arrivedAt = new Date(updated?.arrived_at_pickup_at || arrivedAtIso).getTime();
""",
          )

          replace_once(
              'src/components/InteractiveMap.jsx',
              """const InteractiveMap = (props) => (
    <Suspense fallback={<MapSkeleton className={props.className} />}>
        {useMapbox ? <InteractiveMapMapbox {...props} /> : <InteractiveMapGoogle {...props} />}
    </Suspense>
);
""",
              """const InteractiveMap = (props) => {
    // Remount the map engine when a trip changes or closes so third-party
    // renderers cannot leave an old route painted on the driver's idle map.
    const mapInstanceKey = `${useMapbox ? 'mapbox' : 'google'}:${props.activeRideId || 'idle'}:${props.navStep || 0}`;

    return (
        <Suspense fallback={<MapSkeleton className={props.className} />}>
            {useMapbox
                ? <InteractiveMapMapbox key={mapInstanceKey} {...props} />
                : <InteractiveMapGoogle key={mapInstanceKey} {...props} />}
        </Suspense>
    );
};
""",
          )

          replace_once(
              'src/components/InteractiveMapGoogle.jsx',
              """    useEffect(() => {
        if (!routesLibrary || !map) return;
        setDirectionsService(new routesLibrary.DirectionsService());
        setDirectionsRenderer(new routesLibrary.DirectionsRenderer({
            map,
            suppressMarkers: true, // We will use custom markers
            preserveViewport: true, // IMPORTANT: Don't jump zoom on every GPS update
            polylineOptions: {
                strokeColor: routeColor || '#22c55e', // Default or Custom
                strokeOpacity: 1.0,
                strokeWeight: 6,
            }
        }));
    }, [routesLibrary, map]);

    useEffect(() => {
        if (!directionsService || !directionsRenderer || !origin || !destination) return;

        // Prevent routing if origin is same as destination (within small threshold)
        const isSameLoc = Math.abs(origin.lat - destination.lat) < 0.0001 && Math.abs(origin.lng - destination.lng) < 0.0001;
        if (isSameLoc) return;

        directionsService.route({
            origin: origin,
            destination: destination,
            travelMode: 'DRIVING',
            provideRouteAlternatives: false
        }).then(response => {
            directionsRenderer.setDirections(response);
            setRoutes(response.routes);

            // Extract ETA data from the first leg
            const leg = response.routes[0]?.legs[0];
            const overviewPath = response.routes[0]?.overview_path || [];

            if (leg && onRouteData) {
                const nextStep = leg.steps?.[0];
                let nextHeading = 0;
                if (nextStep) {
                    const s = nextStep.start_location;
                    const e = nextStep.end_location;
                    nextHeading = Math.atan2(e.lng() - s.lng(), e.lat() - s.lat()) * 180 / Math.PI;
                }

                // Steps completas para turn-by-turn voice nav. Google
                // devuelve `instructions` con HTML (ej: "Turn <b>right</b>");
                // limpiamos para que TTS pronuncie texto plano.
                const stripHtml = (html) => {
                    if (!html) return '';
                    return html
                        .replace(/<div[^>]*>/gi, '. ')
                        .replace(/<\/div>/gi, '')
                        .replace(/<br\s*\/?>/gi, '. ')
                        .replace(/<[^>]+>/g, '')
                        .replace(/&nbsp;/g, ' ')
                        .replace(/&amp;/g, '&')
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>')
                        .replace(/\s+/g, ' ')
                        .trim();
                };

                const stepsForNav = (leg.steps || []).map(step => ({
                    instruction:     stripHtml(step.instructions),
                    htmlInstruction: step.instructions,
                    distance:        step.distance,
                    duration:        step.duration,
                    maneuver:        step.maneuver,
                    start_location:  { lat: step.start_location.lat(), lng: step.start_location.lng() },
                    end_location:    { lat: step.end_location.lat(),   lng: step.end_location.lng() },
                }));

                onRouteData({
                    duration: leg.duration,
                    distance: leg.distance,
                    end_location: leg.end_location,
                    start_location: leg.start_location,
                    overviewPath: overviewPath.map(p => ({ lat: p.lat(), lng: p.lng() })),
                    steps: stepsForNav,
                    next_step: nextStep ? {
                        instruction: nextStep.instructions,
                        distance: nextStep.distance,
                        heading: nextHeading
                    } : null
                });
            }
        }).catch(e => console.error("Directions request failed", e));

    }, [directionsService, directionsRenderer, origin, destination]);
""",
              """    useEffect(() => {
        if (!routesLibrary || !map) return undefined;

        const service = new routesLibrary.DirectionsService();
        const renderer = new routesLibrary.DirectionsRenderer({
            map,
            suppressMarkers: true, // We will use custom markers
            preserveViewport: true, // IMPORTANT: Don't jump zoom on every GPS update
            polylineOptions: {
                strokeColor: routeColor || '#22c55e', // Default or Custom
                strokeOpacity: 1.0,
                strokeWeight: 6,
            }
        });

        setDirectionsService(service);
        setDirectionsRenderer(renderer);

        return () => {
            renderer.setMap(null);
        };
    }, [routesLibrary, map, routeColor]);

    useEffect(() => {
        if (!directionsService || !directionsRenderer || !map) return undefined;

        let cancelled = false;

        if (!origin || !destination) {
            directionsRenderer.setMap(null);
            setRoutes([]);
            return undefined;
        }

        // Prevent routing if origin is same as destination (within small threshold)
        const isSameLoc = Math.abs(origin.lat - destination.lat) < 0.0001 && Math.abs(origin.lng - destination.lng) < 0.0001;
        if (isSameLoc) {
            directionsRenderer.setMap(null);
            setRoutes([]);
            return undefined;
        }

        directionsRenderer.setMap(map);
        directionsService.route({
            origin,
            destination,
            travelMode: 'DRIVING',
            provideRouteAlternatives: false
        }).then(response => {
            if (cancelled) return;
            directionsRenderer.setDirections(response);
            setRoutes(response.routes);

            // Extract ETA data from the first leg
            const leg = response.routes[0]?.legs[0];
            const overviewPath = response.routes[0]?.overview_path || [];

            if (leg && onRouteData) {
                const nextStep = leg.steps?.[0];
                let nextHeading = 0;
                if (nextStep) {
                    const s = nextStep.start_location;
                    const e = nextStep.end_location;
                    nextHeading = Math.atan2(e.lng() - s.lng(), e.lat() - s.lat()) * 180 / Math.PI;
                }

                // Steps completas para turn-by-turn voice nav. Google
                // devuelve `instructions` con HTML (ej: "Turn <b>right</b>");
                // limpiamos para que TTS pronuncie texto plano.
                const stripHtml = (html) => {
                    if (!html) return '';
                    return html
                        .replace(/<div[^>]*>/gi, '. ')
                        .replace(/<\/div>/gi, '')
                        .replace(/<br\s*\/?>/gi, '. ')
                        .replace(/<[^>]+>/g, '')
                        .replace(/&nbsp;/g, ' ')
                        .replace(/&amp;/g, '&')
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>')
                        .replace(/\s+/g, ' ')
                        .trim();
                };

                const stepsForNav = (leg.steps || []).map(step => ({
                    instruction:     stripHtml(step.instructions),
                    htmlInstruction: step.instructions,
                    distance:        step.distance,
                    duration:        step.duration,
                    maneuver:        step.maneuver,
                    start_location:  { lat: step.start_location.lat(), lng: step.start_location.lng() },
                    end_location:    { lat: step.end_location.lat(),   lng: step.end_location.lng() },
                }));

                onRouteData({
                    duration: leg.duration,
                    distance: leg.distance,
                    end_location: leg.end_location,
                    start_location: leg.start_location,
                    overviewPath: overviewPath.map(p => ({ lat: p.lat(), lng: p.lng() })),
                    steps: stepsForNav,
                    next_step: nextStep ? {
                        instruction: nextStep.instructions,
                        distance: nextStep.distance,
                        heading: nextHeading
                    } : null
                });
            }
        }).catch(e => {
            if (!cancelled) console.error("Directions request failed", e);
        });

        return () => {
            cancelled = true;
            directionsRenderer.setMap(null);
            setRoutes([]);
        };
    }, [directionsService, directionsRenderer, map, origin?.lat, origin?.lng, destination?.lat, destination?.lng]);
""",
          )

          replace_once(
              'src/pages/RideStatusPage.jsx',
              '                                        body: "🚗 ¡Tu Higo Driver ha llegado!",',
              '                                        body: "🚗 ¡Tu viaje ha comenzado!",',
          )
          replace_once(
              'src/pages/RideStatusPage.jsx',
              '                            toast.success("🔔 ¡Tu Higo Driver ha llegado!");',
              '                            toast.success("🚗 ¡Tu viaje ha comenzado!");',
          )

          replace_once(
              '.github/workflows/deploy.yml',
              """      - name: Deploy higodriver via lftp
        if: ${{ !cancelled() }}
""",
              """      - name: Checkout current Higo Driver website
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          repository: manuelgonzalez18-ui/Higo-Driver
          ref: main
          path: higodriver-live

      - name: Deploy higodriver via lftp
        if: ${{ !cancelled() }}
""",
          )
          replace_once(
              '.github/workflows/deploy.yml',
              """          mirror --reverse --verbose --parallel=1 --no-perms --ignore-time --exclude-glob .ftp-deploy-sync-state.json --exclude '(^|\/)\.builds(\/|$)' ./higodriver/ ./;
""",
              """          mirror --reverse --verbose --parallel=1 --no-perms --ignore-time --exclude-glob .ftp-deploy-sync-state.json --exclude '(^|\/)\.builds(\/|$)' --exclude '(^|\/)\.git(\/|$)' --exclude '(^|\/)\.github(\/|$)' ./higodriver-live/ ./;
          put -O ./ ./higodriver-live/index.html;
""",
          )

          obsolete = Path('.github/workflows/one-shot-driver-feedback-hotfix.yml')
          if obsolete.exists():
              obsolete.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate tests and production build
        env:
          VITE_SHOP_ENABLED: 'false'
        run: npm run check

      - name: Commit hotfix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(driver): limpiar rutas, avisar llegada y actualizar sitio"
          git push origin HEAD:agent/fix-driver-feedback-20260725
