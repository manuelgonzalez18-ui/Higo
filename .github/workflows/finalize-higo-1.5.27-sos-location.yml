name: Finalize Higo 1.5.27 SOS Live Location

on:
  push:
    branches:
      - fix/higo-1.5.27-sos-live-location
    paths:
      - .github/workflows/finalize-higo-1.5.27-sos-location.yml

permissions:
  contents: write

jobs:
  build-release:
    name: Validate SOS fix and build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout SOS fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/higo-1.5.27-sos-live-location
          fetch-depth: 0

      - name: Apply SOS live-location patch
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/build-higo-1.5.27-sos-location.yml').read_text(encoding='utf-8')
          match = re.search(r'HIGO_PATCH_GZ_B64:\s*"([^"]+)"', workflow)
          if not match:
              raise SystemExit('embedded SOS patch not found')
          patch = gzip.decompress(base64.b64decode(match.group(1)))
          target = Path('scripts/.tmp_apply_higo_1_5_27_sos_location.py')
          target.write_bytes(patch)
          compile(patch, str(target), 'exec')
          PY
          python3 scripts/.tmp_apply_higo_1_5_27_sos_location.py
          rm -f scripts/.tmp_apply_higo_1_5_27_sos_location.py

      - name: Align regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          background = Path('tests/backgroundPassengerAlertsRegression.test.mjs')
          content = background.read_text(encoding='utf-8')
          content = content.replace(
              'assert.match(client, /GEO_SOFT_TIMEOUT_MS = 700/);',
              'assert.doesNotMatch(client, /GEO_SOFT_TIMEOUT_MS/);',
          )
          content = content.replace(
              'assert.match(client, /GEO_FOLLOW_UP_TIMEOUT_MS = 12000/);',
              'assert.match(client, /GEO_FOLLOW_UP_TIMEOUT_MS = 15000/);',
          )
          content = content.replace(
              "test('Android release version is 1.5.25 build 57'",
              "test('Android release version is 1.5.27 build 59'",
          )
          content = content.replace('/versionCode 58/', '/versionCode 59/')
          content = content.replace('1\\.5\\.26', '1\\.5\\.27')
          background.write_text(content, encoding='utf-8')

          sos = Path('tests/sosLocationRegression.test.mjs')
          content = sos.read_text(encoding='utf-8')
          replacements = (
              (r'/Geolocation\\.getCurrentPosition/', r'/Geolocation\.getCurrentPosition/'),
              (r'/readEmergencyLocation\\(\\)/', r'/readEmergencyLocation\(\)/'),
              (r"/'metadata' => \\$metadata/", r"/'metadata' => \$metadata/"),
              (r'/versionName "1\\.5\\.27"/', r'/versionName "1\.5\.27"/'),
          )
          for old, new in replacements:
              content = content.replace(old, new)
          sos.write_text(content, encoding='utf-8')
          PY

      - name: Verify contracts and PHP syntax
        run: |
          grep -q "versionCode 59" android/app/build.gradle
          grep -q 'versionName "1.5.27"' android/app/build.gradle
          grep -q "Geolocation.getCurrentPosition" src/utils/emergencyLocation.js
          grep -q "readEmergencyLocation" src/utils/triggerEmergencyAlert.js
          grep -q "driver_vehicle_last_known" public/api/send-emergency.php
          grep -q "renderMessageContent" src/pages/AdminSupportPage.jsx
          php -l public/api/send-emergency.php
          php -l public/api/update-emergency-location.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run SOS and release regressions
        run: |
          node --test \
            tests/sosLocationRegression.test.mjs \
            tests/passengerResumePushRegression.test.mjs \
            tests/backgroundPassengerAlertsRegression.test.mjs \
            tests/driverGhostOfferRegression.test.mjs \
            tests/routeWaypoints.test.mjs

      - name: Build web bundle
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public/api android/app/build.gradle tests
          git diff --cached --check
          git commit -m "fix: deliver SOS coordinates with native and server fallbacks [skip ci]"
          git push origin HEAD:fix/higo-1.5.27-sos-live-location

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 no está configurado"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release-key.jks
          magic=$(head -c 2 android/app/release-key.jks | xxd -p)
          if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
            echo "::error::Keystore inválido (magic=0x$magic)"
            exit 1
          fi

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Prepare artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab higo-1.5.27-59-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk higo-1.5.27-59-release.apk
          sha256sum higo-1.5.27-59-release.aab higo-1.5.27-59-release.apk > SHA256SUMS.txt

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.27-59-aab
          path: |
            higo-1.5.27-59-release.aab
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.27-59-apk
          path: |
            higo-1.5.27-59-release.apk
            SHA256SUMS.txt
          retention-days: 30
