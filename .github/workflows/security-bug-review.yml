name: Security audit
on:
  schedule:
    - cron: '45 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-audit
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-fund
      - name: Deterministic audit including build dependencies
        run: npm audit --audit-level=high --json > dependency-audit.json
      - name: Preserve audit report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-audit.json
          if-no-files-found: error
      - name: Publish failure summary
        if: failure()
        run: echo 'Dependency audit failed. Inspect the dependency-audit artifact. This run is a failed security check.' >> "$GITHUB_STEP_SUMMARY"
  optional-ai-review:
    if: vars.ENABLE_AI_AUDIT == 'true'
    needs: [quality, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only supplemental code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_AUDIT_MODEL: ${{ vars.AI_AUDIT_MODEL }}
        run: node scripts/ai-audit.mjs
      - name: Preserve supplemental report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-ai-review-${{ github.sha }}
          path: ai-audit.md
          if-no-files-found: error
      - name: Show review status
        if: always()
        run: |
          if [ -s ai-audit.md ]; then cat ai-audit.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ '${{ job.status }}' != success ]; then echo 'Optional AI review FAILED; no review coverage can be claimed for this run.' >> "$GITHUB_STEP_SUMMARY"; fi
