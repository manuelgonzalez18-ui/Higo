name: Quality Gate
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_call:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --legacy-peer-deps --no-fund
      - run: npm run check:migrations
      - run: npm run lint
      - name: Validate release shell syntax
        run: for script in scripts/deploy-release.sh scripts/test-deploy-release.sh; do bash -n "$script"; done
      - name: Verify artifact checksums and local rollback simulation
        run: |
          node --test scripts/release-tools.test.mjs
          bash scripts/test-deploy-release.sh
      - run: npm run test:run
      - run: npm run test:unit
      - run: npm run test:php
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 7
  database-reconstruction:
    name: Reconciled schema restoration and launch behavior
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - name: Verify reviewed baseline checksum
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const base = 'supabase/baselines/20260920/';
          const manifest = JSON.parse(readFileSync(base + 'manifest.json', 'utf8'));
          assert.equal(createHash('sha256').update(readFileSync(base + 'staging-baseline.sql')).digest('hex'), manifest.sha256);
          JS
      - name: Restore actual application schema and apply launch changes
        shell: bash
        run: |
          set -euo pipefail
          staged=$(mktemp -d)
          mv supabase/migrations/*.sql "$staged/"
          supabase db start
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/baselines/20260920/staging-baseline.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -t -A -f scripts/schema-inventory.sql > restored-schema-inventory.json
          for migration in 20260917001153_launch_ride_integrity.sql 20260917001201_authoritative_route_quotes.sql; do
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$staged/$migration"
          done
          PGOPTIONS='-c higo.disposable_database=1' psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/reconciled_configuration.sql
          docker exec -i -e PGPASSWORD supabase_db_higo-platform-ci psql -w -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < supabase/tests/launch_behavior.sql
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Preserve restored schema inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restored-schema-${{ github.sha }}-${{ github.run_id }}
          path: restored-schema-inventory.json
          if-no-files-found: warn
          retention-days: 7
  database-migrations:
    name: Disposable schema contract (not a production baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-fund
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}
      - name: Replay disposable schema contract
        shell: bash
        run: |
          set -euo pipefail
          staged=$(mktemp -d)
          mv supabase/migrations/*.sql "$staged/"
          supabase db start
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/platform_base_fixture.sql
          for migration in "$staged"/*.sql; do
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -t -A -f scripts/schema-inventory.sql > schema-inventory.json
          for test in platform_hardening_postdeploy platform_hardening_behavior driver_application_behavior; do
            psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f "supabase/tests/$test.sql"
          done
          # The local `postgres` role is not a superuser. This transaction must
          # SET SESSION AUTHORIZATION to remove owner exemptions from assertions.
          # Only its fixture setup uses the disposable container's superuser.
          docker exec -i -e PGPASSWORD supabase_db_higo-platform-ci psql -w -U supabase_admin -d postgres -v ON_ERROR_STOP=1 < supabase/tests/launch_behavior.sql
      - name: Verify concurrent requests against disposable PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          HIGO_DISPOSABLE_DATABASE: '1'
        run: node scripts/test-db-concurrency.mjs
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
      - name: Preserve schema inventory without application data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-contract-${{ github.sha }}-${{ github.run_id }}
          path: schema-inventory.json
          if-no-files-found: warn
          retention-days: 7
