name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/platform-hardening

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # The repository still has a historical lint baseline. Keep the global
      # report visible while making all new platform-hardening modules blocking.
      - name: Full lint baseline report
        run: npm run lint
        continue-on-error: true

      - name: Strict lint for hardened modules
        run: >-
          npx eslint
          src/config/features.js
          src/config/features.test.js
          src/services/membershipApi.js
          src/services/rideApi.js
          src/utils/ridePricing.js
          src/utils/ridePricing.test.js
          src/main.jsx

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'false'
          VITE_SERVER_SIDE_RIDE_STATE: 'false'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'false'
        run: npm run build
