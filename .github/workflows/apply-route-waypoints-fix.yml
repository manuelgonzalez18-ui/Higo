name: Apply route waypoints fix

on:
  pull_request:
    paths:
      - src/utils/routeWaypoints.js
      - tests/routeWaypoints.test.mjs
      - scripts/apply_route_waypoints_fix.py
      - scripts/apply_route_waypoints_fix_v2.py
      - .github/workflows/apply-route-waypoints-fix.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-route-waypoints-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          fetch-depth: 0

      - name: Apply exact route integration
        run: python scripts/apply_route_waypoints_fix_v2.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run focused route regression
        run: node --test tests/routeWaypoints.test.mjs

      - name: Validate full app and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
        run: npm run check

      - name: Verify expected integration
        run: |
          grep -q 'optimizeWaypoints: false' src/components/InteractiveMapGoogle.jsx
          grep -q "getRoute(origin, destination, 'driving-traffic', markersProp)" src/components/InteractiveMapMapbox.jsx
          grep -q 'versionCode 51' android/app/build.gradle
          grep -q 'versionName "1.5.19"' android/app/build.gradle

      - name: Commit validated integration to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/InteractiveMapGoogle.jsx \
            src/components/InteractiveMapMapbox.jsx \
            src/services/directionsService.js \
            android/app/build.gradle
          git rm -f \
            .github/workflows/apply-route-waypoints-fix.yml \
            scripts/apply_route_waypoints_fix.py \
            scripts/apply_route_waypoints_fix_v2.py
          git commit -m "fix(routes): draw and price trips through intermediate stops"
          git push origin HEAD:main
