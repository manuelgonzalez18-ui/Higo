name: One-shot Higo Pay last-six reference

on:
  push:
    branches: [agent/higopay-reference-last6]
    paths:
      - '.github/workflows/one-shot-higopay-reference-last6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply exact Higo Pay changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/pages/HigoPayPage.jsx')
          text = page.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { apiUrl } from '../utils/apiUrl';\n",
                  "import { apiUrl } from '../utils/apiUrl';\nimport { normalizeBanescoReference, normalizeTransferReference } from '../utils/paymentReference';\n",
              ),
              (
                  "    const referenceMaxLength = isPagoMovil ? 8 : 12;",
                  "    const referenceMaxLength = isPagoMovil ? 6 : 12;",
              ),
              (
                  "        if (!/^\\d{1,8}$/.test(reference)) throw new Error('La referencia debe ser numérica, de hasta 8 dígitos.');",
                  "        if (!/^\\d{6}$/.test(reference)) throw new Error('Ingresa los últimos 6 dígitos de la referencia.');",
              ),
              (
                  '''                        <FormField label="Referencia"><input value={reference} onChange={(event) => setReference(event.target.value.replace(/\\D/g, '').slice(0, referenceMaxLength))} inputMode="numeric" required className="w-full bg-[#0F1014] border border-white/10 rounded-xl px-4 py-3 text-sm font-mono" /></FormField>''',
                  '''                        <FormField label={isPagoMovil ? 'Referencia · Últimos 6 dígitos' : 'Referencia'}>
                            <input
                                value={reference}
                                onChange={(event) => setReference(isPagoMovil
                                    ? normalizeBanescoReference(event.target.value)
                                    : normalizeTransferReference(event.target.value))}
                                inputMode="numeric"
                                maxLength={referenceMaxLength}
                                placeholder={isPagoMovil ? 'Ej. 229907' : ''}
                                required
                                className="w-full bg-[#0F1014] border border-white/10 rounded-xl px-4 py-3 text-sm font-mono"
                            />
                        </FormField>''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'HigoPayPage.jsx: expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          page.write_text(text, encoding='utf-8')

          backend = Path('public/api/banesco-validate-v2.php')
          text = backend.read_text(encoding='utf-8')
          replacements = [
              (
                  "$reference = trim((string) ($input['reference'] ?? ''));",
                  "$referenceRaw = (string) ($input['reference'] ?? '');\n$referenceDigits = preg_replace('/\\D+/', '', $referenceRaw);\n$reference = is_string($referenceDigits) ? substr($referenceDigits, -6) : '';",
              ),
              (
                  "if (!preg_match('/^\\d{1,12}$/', $reference)) $errors[] = 'La referencia debe tener entre 1 y 12 dígitos.';",
                  "if (!preg_match('/^\\d{6}$/', $reference)) $errors[] = 'La referencia debe contener los últimos 6 dígitos.';",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'banesco-validate-v2.php: expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          backend.write_text(text, encoding='utf-8')
          PY

      - name: Validate change
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/paymentReference.test.mjs
          php -l public/api/banesco-validate-v2.php
          grep -Fq "Referencia · Últimos 6 dígitos" src/pages/HigoPayPage.jsx
          grep -Fq "normalizeBanescoReference" src/pages/HigoPayPage.jsx
          grep -Fq "substr(\$referenceDigits, -6)" public/api/banesco-validate-v2.php

      - name: Remove workflow and push branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-higopay-reference-last6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/HigoPayPage.jsx src/utils/paymentReference.js tests/paymentReference.test.mjs public/api/banesco-validate-v2.php .github/workflows/one-shot-higopay-reference-last6.yml
          git commit -m 'fix(higopay): use last six digits of Banesco reference'
          git push origin HEAD:agent/higopay-reference-last6
