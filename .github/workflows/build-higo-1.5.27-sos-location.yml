name: Build Higo 1.5.27 SOS Live Location

on:
  push:
    branches:
      - fix/higo-1.5.27-sos-live-location
    paths:
      - .github/workflows/build-higo-1.5.27-sos-location.yml

permissions:
  contents: write

jobs:
  build-release:
    name: Apply SOS fix, test and build signed Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout SOS fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/higo-1.5.27-sos-live-location
          fetch-depth: 0

      - name: Apply SOS live-location hardening
        env:
          HIGO_PATCH_GZ_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          patch = gzip.decompress(base64.b64decode(os.environ['HIGO_PATCH_GZ_B64']))
          target = Path('/tmp/apply_higo_1_5_27_sos_location.py')
          target.write_bytes(patch)
          compile(patch, str(target), 'exec')
          PY
          python3 /tmp/apply_higo_1_5_27_sos_location.py

      - name: Verify changed contracts
        run: |
          grep -q "versionCode 59" android/app/build.gradle
          grep -q 'versionName "1.5.27"' android/app/build.gradle
          grep -q "Geolocation.getCurrentPosition" src/utils/emergencyLocation.js
          grep -q "driver_vehicle_last_known" public/api/send-emergency.php
          grep -q "renderMessageContent" src/pages/AdminSupportPage.jsx
          grep -q "GPS preciso del dispositivo" public/api/update-emergency-location.php

      - name: Lint PHP emergency endpoints
        run: |
          php -l public/api/send-emergency.php
          php -l public/api/update-emergency-location.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run SOS and release regressions
        run: |
          node --test \
            tests/sosLocationRegression.test.mjs \
            tests/passengerResumePushRegression.test.mjs \
            tests/backgroundPassengerAlertsRegression.test.mjs \
            tests/driverGhostOfferRegression.test.mjs \
            tests/routeWaypoints.test.mjs

      - name: Build web bundle with production flags
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.ANDROID_GOOGLE_MAPS_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Commit validated SOS source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/utils/emergencyLocation.js \
            src/utils/triggerEmergencyAlert.js \
            src/hooks/useGeolocation.js \
            src/pages/AdminSupportPage.jsx \
            public/api/send-emergency.php \
            public/api/update-emergency-location.php \
            android/app/build.gradle \
            tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: deliver SOS coordinates with native and server fallbacks [skip ci]"
            git push origin HEAD:fix/higo-1.5.27-sos-live-location
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 no está configurado"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/app/release-key.jks
          magic=$(head -c 2 android/app/release-key.jks | xxd -p)
          if [ "$magic" != "feed" ] && [ "$magic" != "3082" ]; then
            echo "::error::Keystore inválido (magic=0x$magic)"
            exit 1
          fi

      - name: Build signed AAB and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Prepare release artifacts
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab higo-1.5.27-59-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk higo-1.5.27-59-release.apk
          sha256sum higo-1.5.27-59-release.aab higo-1.5.27-59-release.apk > SHA256SUMS.txt
          ls -lh higo-1.5.27-59-release.aab higo-1.5.27-59-release.apk SHA256SUMS.txt

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.27-59-aab
          path: |
            higo-1.5.27-59-release.aab
            SHA256SUMS.txt
          retention-days: 30

      - name: Upload device APK
        uses: actions/upload-artifact@v4
        with:
          name: higo-1.5.27-59-apk
          path: |
            higo-1.5.27-59-release.apk
            SHA256SUMS.txt
          retention-days: 30
