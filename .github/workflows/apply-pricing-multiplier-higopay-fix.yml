name: Apply pricing multiplier and Higo Pay fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pricing-multiplier-higopay-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact source integrations
        run: python scripts/apply_pricing_multiplier_higopay_fix.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate focused regressions
        run: >-
          node --test
          tests/paymentReference.test.mjs
          tests/pricingPresentation.test.mjs

      - name: Validate migrations, tests and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'false'
          VITE_SERVER_SIDE_RIDE_STATE: 'false'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'false'
          VITE_DIRECTED_RIDE_OFFERS: 'false'
        run: npm run check

      - name: Commit validated integration and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/HigoPayPage.jsx src/pages/AdminRidesPage.jsx
          git rm .github/workflows/apply-pricing-multiplier-higopay-fix.yml scripts/apply_pricing_multiplier_higopay_fix.py
          git commit -m "fix: persist and display ride multiplier and normalize Pago Móvil paste"
          git push origin HEAD:main
