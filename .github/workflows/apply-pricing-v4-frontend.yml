name: Apply Pricing V4 frontend

# One-shot seguro. El PR valida migraciones, utilidades y componentes. Cuando
# entra en main, este job integra las tres páginas grandes, ejecuta toda la
# validación y solo entonces crea el commit. Después se elimina a sí mismo.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pricing-v4-frontend.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact frontend integrations
        run: python scripts/apply_pricing_v4_frontend.py

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Validate migrations, tests and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'false'
          VITE_SERVER_SIDE_RIDE_STATE: 'false'
        run: npm run check

      - name: Commit validated integration and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminPricingPage.jsx src/pages/RequestRidePage.jsx src/pages/ConfirmTripPage.jsx
          git rm .github/workflows/apply-pricing-v4-frontend.yml scripts/apply_pricing_v4_frontend.py
          git commit -m "feat(pricing): integrate V4 quote across passenger and admin flows"
          git push origin HEAD:main
