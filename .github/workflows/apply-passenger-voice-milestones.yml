name: Apply passenger voice milestones

on:
  pull_request:
    paths:
      - src/utils/passengerRideVoice.js
      - scripts/apply_passenger_voice_milestones.py
      - .github/workflows/apply-passenger-voice-milestones.yml
      - .github/workflows/build-higo-1.5.18-aab.yml
      - .github/workflows/build-higo-1.5.17-aab.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-passenger-voice-milestones.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'main' || github.head_ref }}
          fetch-depth: 0

      - name: Apply exact passenger voice integration
        run: python scripts/apply_passenger_voice_milestones.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run focused passenger voice regression
        run: node --test tests/passengerRideVoice.test.mjs

      - name: Validate migrations, full tests and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'true'
          VITE_SERVER_SIDE_RIDE_STATE: 'true'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'true'
          VITE_DIRECTED_RIDE_OFFERS: 'true'
        run: npm run check

      - name: Verify expected integration diff
        run: |
          grep -q "announcePassengerRideMilestone" src/pages/ConfirmTripPage.jsx
          grep -q "milestone: 'searching'" src/pages/ConfirmTripPage.jsx
          grep -q "announcePassengerRideState(payload.new)" src/pages/RideStatusPage.jsx
          grep -q "announcePassengerRideState(data)" src/pages/RideStatusPage.jsx
          grep -q 'versionCode 50' android/app/build.gradle
          grep -q 'versionName "1.5.18"' android/app/build.gradle
          test -f tests/passengerRideVoice.test.mjs

      - name: Commit validated integration to main
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/pages/ConfirmTripPage.jsx \
            src/pages/RideStatusPage.jsx \
            android/app/build.gradle \
            tests/passengerRideVoice.test.mjs
          git rm -f \
            .github/workflows/apply-passenger-voice-milestones.yml \
            scripts/apply_passenger_voice_milestones.py
          git commit -m "feat(passenger): anunciar por voz los hitos del viaje"
          git push origin HEAD:main
