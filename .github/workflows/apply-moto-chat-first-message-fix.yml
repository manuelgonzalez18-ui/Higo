name: Apply motorcycle marker and first chat notification fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-moto-chat-first-message-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact source integrations
        run: |
          python scripts/apply_moto_chat_first_message_fix.py
          python scripts/apply_chat_identity_guard.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run focused ride experience regressions
        run: node --test tests/rideExperienceRegression.test.mjs

      - name: Validate application and production build
        env:
          VITE_SHOP_ENABLED: 'false'
          VITE_SERVER_SIDE_RIDE_PRICING: 'false'
          VITE_SERVER_SIDE_RIDE_STATE: 'false'
          VITE_UNIFIED_MEMBERSHIP_CHECKOUT: 'false'
          VITE_DIRECTED_RIDE_OFFERS: 'false'
        run: npm run check

      - name: Commit validated integration and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/InteractiveMapGoogle.jsx \
            src/components/ChatWidget.jsx \
            android/app/build.gradle
          git rm \
            .github/workflows/apply-moto-chat-first-message-fix.yml \
            scripts/apply_moto_chat_first_message_fix.py \
            scripts/apply_chat_identity_guard.py
          git commit -m "fix: keep motorcycle upright and recover first ride message"
          git push origin HEAD:main
