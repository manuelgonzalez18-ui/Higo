name: Verified release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      deploy_web:
        type: boolean
        default: false
      build_android:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  artifact:
    needs: quality
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    env:
      VITE_APP_ENV: ${{ inputs.environment }}
      VITE_GIT_SHA: ${{ github.sha }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_DIRECTED_RIDE_OFFERS: ${{ vars.VITE_DIRECTED_RIDE_OFFERS || 'false' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require reconciled backend before packaging a launch build
        env:
          LAUNCH_DATABASE_READY: ${{ vars.LAUNCH_DATABASE_READY }}
          DIRECTED_DISPATCH_READY: ${{ vars.DIRECTED_DISPATCH_READY }}
          RELEASE_BRANCH: ${{ github.ref }}
        run: |
          test "$LAUNCH_DATABASE_READY" = true || { echo 'Reconcile and validate the deployed database before enabling LAUNCH_DATABASE_READY.' >&2; exit 1; }
          if [ "$VITE_APP_ENV" = production ]; then test "$RELEASE_BRANCH" = refs/heads/main; fi
          if [ "$VITE_DIRECTED_RIDE_OFFERS" = true ]; then test "$DIRECTED_DISPATCH_READY" = true; fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci --legacy-peer-deps --no-fund
      - run: npm run build:release
      - name: Verify packaged inventory and environment
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/verify-release.mjs
      - run: npx playwright install --with-deps chromium
      - name: Test exact release artifact with all external services intercepted
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: higo-web-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  deploy:
    if: inputs.deploy_web
    needs: artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: higo-web-${{ github.sha }}
          path: dist
      - name: Publish complete release with verified SSH and rollback
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/deploy-release.sh
  android:
    if: inputs.build_android
    needs: artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --legacy-peer-deps --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: higo-web-${{ github.sha }}
          path: dist
      - name: Verify the Android input artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        run: node scripts/verify-release.mjs
      - run: npx cap sync android
      - name: Install isolated native Firebase configuration
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
        run: |
          test -n "$ANDROID_GOOGLE_SERVICES_JSON"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          node --input-type=module -e 'import fs from "node:fs"; const config=JSON.parse(fs.readFileSync("android/app/google-services.json")); if(!process.env.FIREBASE_PROJECT_ID || config.project_info?.project_id!==process.env.FIREBASE_PROJECT_ID) throw Error("Native Firebase project differs from release environment");'
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks
      - name: Build signed Android from tested web artifact
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
      - if: always()
        run: rm -f android/app/release-key.jks
      - uses: actions/upload-artifact@v4
        with:
          name: higo-android-${{ github.sha }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            dist/release.json
          if-no-files-found: error
          retention-days: 30
