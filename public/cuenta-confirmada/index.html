<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuenta confirmada · Higo</title>
  <meta name="description" content="Tu correo fue confirmado. Ya podés iniciar sesión en Higo.">
  <meta name="theme-color" content="#0A1330">
  <meta name="robots" content="noindex,nofollow">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:#0A1330;
      color:#e5e7eb;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      -webkit-font-smoothing:antialiased;
    }
    .card {
      background:#ffffff;
      color:#0A1330;
      max-width:440px;
      width:100%;
      border-radius:20px;
      padding:40px 32px;
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.35);
    }
    .logo { width:56px; height:56px; border-radius:12px; margin-bottom:8px; }
    .check {
      width:76px; height:76px; margin:8px auto 20px;
      background:#dcfce7; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }
    .check svg { width:42px; height:42px; }
    h1 { font-size:24px; font-weight:800; letter-spacing:-0.4px; margin-bottom:10px; color:#0A1330; }
    p { font-size:15px; line-height:1.65; color:#475569; margin-bottom:8px; }
    .btn {
      display:inline-block; margin-top:22px;
      background:#2563EB; color:#fff; text-decoration:none;
      font-size:16px; font-weight:700;
      padding:14px 34px; border-radius:12px;
    }
    .foot { margin-top:26px; font-size:12px; color:#94a3b8; }
    .foot a { color:#2563EB; text-decoration:none; }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://higodriver.com/assets/logo-email.jpg" alt="Higo" class="logo"
         onerror="this.style.display='none'">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6L9 17l-5-5" stroke="#16a34a" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>¡Cuenta confirmada!</h1>
    <p>Tu correo fue verificado con éxito.</p>
    <p>Ya podés abrir Higo e iniciar sesión para empezar a moverte.</p>

    <a href="https://higoapp.com" class="btn">Abrir Higo</a>

    <div class="foot">
      ¿Necesitás ayuda? <a href="mailto:soporte@higodriver.com">soporte@higodriver.com</a><br>
      Higo · Tecnología en movilidad
    </div>
  </div>
</body>
</html>
